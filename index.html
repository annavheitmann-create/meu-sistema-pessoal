<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meu Sistema</title>
  <meta name="description" content="Agenda e dashboard pessoal">
  <meta name="theme-color" content="#fbf8f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meu Sistema">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main" class="view"></main>

  <button id="fab" class="fab" data-a="fab" aria-label="Adicionar" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="nav">
    <button data-a="tab" data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
    <button data-a="tab" data-tab="pessoal"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Pessoal</span></button>
    <button data-a="tab" data-tab="trabalho"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg><span>Trabalho</span></button>
    <button data-a="tab" data-tab="ideias"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Ideias</span></button>
    <button data-a="tab" data-tab="wishlist"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>Wishlist</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-a="close-sheet"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
